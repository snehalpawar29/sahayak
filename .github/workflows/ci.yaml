name: Sahayak CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sahayak-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-checks:
    name: Backend Dependencies
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/sahayak_ci
      JWT_SECRET: ci-only-placeholder-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend-checks
      - backend-checks

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/sahayak_ci
      JWT_SECRET: ci-only-placeholder-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sahayak-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: sahayak-frontend:ci
  
  
  image-scan:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -t sahayak-frontend:ci \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t sahayak-backend:ci \
            ./backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.65.0
          image-ref: sahayak-frontend:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.65.0
          image-ref: sahayak-backend:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

