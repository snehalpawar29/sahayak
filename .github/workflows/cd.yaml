
name: Sahayak CD

on:
  workflow_run:
    workflows: ["Sahayak CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: sahayak-cluster-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Elastic Beanstalk Cluster
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "033161567802"
      EB_APPLICATION: Sahayak
      BACKEND_ENVIRONMENT: Sahayak-env
      FRONTEND_ENVIRONMENT: Sahayak-frontend-env
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::033161567802:role/SahayakGitHubActionsECRRole
          aws-region: us-east-1

      - name: Verify ECR images
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name sahayak-backend \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name sahayak-frontend \
            --image-ids imageTag="$IMAGE_TAG"

      - name: Create backend application version
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/sahayak-backend:${IMAGE_TAG}"
          VERSION="backend-${IMAGE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION" \
            --description "Backend image ${IMAGE_TAG}" \
            --image-configuration "{\"Source\":{\"Uri\":\"${IMAGE_URI}\"}}"

          echo "BACKEND_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION" \
            --environment-name "$BACKEND_ENVIRONMENT" \
            --version-label "$BACKEND_VERSION"

          aws elasticbeanstalk wait environment-updated \
            --environment-names "$BACKEND_ENVIRONMENT"

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$BACKEND_ENVIRONMENT" \
            --query 'Environments[0].[EnvironmentName,Status,Health,VersionLabel]' \
            --output table

      - name: Create frontend application version
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/sahayak-frontend:${IMAGE_TAG}"
          VERSION="frontend-${IMAGE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION" \
            --description "Frontend image ${IMAGE_TAG}" \
            --image-configuration "{\"Source\":{\"Uri\":\"${IMAGE_URI}\"}}"

          echo "FRONTEND_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION" \
            --environment-name "$FRONTEND_ENVIRONMENT" \
            --version-label "$FRONTEND_VERSION"

          aws elasticbeanstalk wait environment-updated \
            --environment-names "$FRONTEND_ENVIRONMENT"

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$FRONTEND_ENVIRONMENT" \
            --query 'Environments[0].[EnvironmentName,Status,Health,VersionLabel]' \
            --output table
