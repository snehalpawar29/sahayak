services:
  backend:
    image: 033161567802.dkr.ecr.us-east-1.amazonaws.com/sahayak-backend:1ce9cd21ba462cd931027c9ad750d7d5f03e1b1f
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: "5000"
      NODE_ENV: production
    expose:
      - "5000"
    networks:
      - sahayak-network

  frontend:
    image: 033161567802.dkr.ecr.us-east-1.amazonaws.com/sahayak-frontend:1ce9cd21ba462cd931027c9ad750d7d5f03e1b1f
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sahayak-network

networks:
  sahayak-network:
    driver: bridge