services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Elastic Beanstalk environment}
    volumes:
      - eb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://sahayak:${POSTGRES_PASSWORD}@postgres:5432/sahayak
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the Elastic Beanstalk environment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_VERIFICATION_BUCKET: ${S3_VERIFICATION_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && node src/server.js"]
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: nginx.eb.conf
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  eb_postgres_data:
