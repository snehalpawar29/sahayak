services:
  postgres:
    image: postgres:16
    container_name: sahayak-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sahayak_user
      POSTGRES_PASSWORD: sahayak_password
      POSTGRES_DB: sahayak_DB

    ports:
      - "5432:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    networks:
      - sahayak-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahayak-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 5000
      NODE_ENV: production

    networks:
      - sahayak-network
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahayak-frontend
    restart: unless-stopped
    networks:
      - sahayak-network
    ports:
      - "5173:80"
    depends_on:
      - backend
      - postgres

volumes:
  postgres_data:

networks:
  sahayak-network:
    name: sahayak-network
    driver: bridge