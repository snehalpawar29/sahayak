
# HTTP: retain Let's Encrypt validation and redirect other requests to HTTPS
server {
    listen 80;
    server_name snehaldevopsengineer.online www.snehaldevopsengineer.online;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: serve the frontend and proxy API requests
server {
    listen 443 ssl;
    server_name snehaldevopsengineer.online www.snehaldevopsengineer.online;

    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/snehaldevopsengineer.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snehaldevopsengineer.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

